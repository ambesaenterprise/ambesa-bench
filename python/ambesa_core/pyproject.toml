[project]
name = "ambesa-core"
version = "0.0.1"
description = "ambesa-core — shared types, LLM provider abstraction, and tool surface for ambesa-bench."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ambesa Enterprise Ltd." }]
keywords = ["dbt", "data-engineering", "agent", "llm", "anthropic"]

dependencies = [
    "anthropic>=0.42.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dbt = ["dbt-core>=1.8.0,<2.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ambesa_core"]
