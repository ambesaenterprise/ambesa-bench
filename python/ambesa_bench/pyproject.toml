[project]
name = "ambesa-bench"
version = "0.1.0"
description = "Reference adapter for the ambesa-bench public dbt-diagnosis benchmark."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ambesa Enterprise Ltd." }]

dependencies = [
    "ambesa-core",
    "click>=8.1.0",
    "pydantic>=2.10.0",
    "structlog>=24.4.0",
]

[project.scripts]
ambesa-bench = "ambesa_bench.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ambesa_bench"]
